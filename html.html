<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Научный калькулятор</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <div class="previous-operand"></div>
            <div class="current-operand">0</div>
        </div>
        
        <div class="buttons">
            <button class="btn operation" data-operation="sin">sin</button>
            <button class="btn operation" data-operation="cos">cos</button>
            <button class="btn operation" data-operation="tg">tg</button>
            <button class="btn operation" data-operation="ctg">ctg</button>
            
            <button class="btn operation" data-operation="!">n!</button>
            <button class="btn operation" data-operation="fib">F(n)</button>
            <button class="btn operation" data-operation="^">xʸ</button>
            <button class="btn operation" data-operation="sqrt">√</button>
            
            <button class="btn clear">AC</button>
            <button class="btn delete">DEL</button>
            <button class="btn operation" data-operation="exp">eˣ</button>
            <button class="btn operation" data-operation="^2">x²</button>
            
            <button class="btn number">7</button>
            <button class="btn number">8</button>
            <button class="btn number">9</button>
            <button class="btn operation" data-operation="/">/</button>
            
            <button class="btn number">4</button>
            <button class="btn number">5</button>
            <button class="btn number">6</button>
            <button class="btn operation" data-operation="*">×</button>
            
            <button class="btn number">1</button>
            <button class="btn number">2</button>
            <button class="btn number">3</button>
            <button class="btn operation" data-operation="-">-</button>
            
            <button class="btn number">0</button>
            <button class="btn operation" data-operation=".">.</button>
            <button class="btn operation" data-operation="=">=</button>
            <button class="btn operation" data-operation="+">+</button>
        </div>
    </div>
    
    <script src="js.js"></script>
</body>
</html>
